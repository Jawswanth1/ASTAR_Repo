<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">One curriculum / two readers</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The browser and future device share content meaning; their rendering and storage formats may differ.</text><rect x="60" y="330" width="310" height="150" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="78" y="365" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Shared content package</text><text x="78" y="395" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Subject / chapter / lesson IDs</text><text x="78" y="418" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sections / questions / rules</text><text x="78" y="441" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Source references + assets</text><rect x="595" y="220" width="500" height="130" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="613" y="255" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Browser reader</text><text x="613" y="285" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Rich layout / localStorage / standalone HTML</text><rect x="595" y="480" width="500" height="150" rx="0" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="7 5"/><text x="613" y="515" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Embedded reader / planned</text><text x="613" y="545" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">microSD / compact assets / local nonvolatile storage</text><text x="613" y="568" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">E-paper paging / physical buttons</text><path d="M370 370L595 285" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M370 430L595 550" stroke="#65636A" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="64" y="672" fill="#65636A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">A shared identifier contract is the goal; binary compatibility and device decoding are not yet tested.</text><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">SOLID = BROWSER / DASHED = PROPOSED EMBEDDED INTEGRATION</text></svg>