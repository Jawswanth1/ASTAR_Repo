<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Software architecture</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Educational structure and rules are independent of the presentation surface.</text><rect x="60" y="260" width="225" height="115" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="78" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Capsule</text><text x="78" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Stable content IDs</text><path d="M285 317L345 317" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="345" y="260" width="225" height="115" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="363" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Reader</text><text x="363" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Circle navigation</text><path d="M570 317L630 317" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="260" width="225" height="115" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="648" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Lesson engine</text><text x="648" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Text / diagrams</text><path d="M855 317L915 317" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="915" y="260" width="225" height="115" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="933" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Rule engine</text><text x="933" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Explicit answers</text><rect x="350" y="495" width="340" height="130" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="368" y="530" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Progress engine</text><text x="368" y="560" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Local records + export/import</text><path d="M1030 375L1030 555" stroke="#0C0C0E" stroke-width="2" fill="none"/><path d="M1030 555L690 555" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="60" y="205" fill="#6852FF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">BROWSER SOFTWARE</text><text x="65" y="678" fill="#65636A" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Embedded renderer, storage limits and fonts remain a separate integration task.</text><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">BROWSER PROTOTYPE / HARDWARE FIRMWARE IS FUTURE WORK</text></svg>