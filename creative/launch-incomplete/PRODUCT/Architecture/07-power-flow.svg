<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Power architecture</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">USB-powered V0 first; solar and storage are a later engineering programme.</text><text x="60" y="222" fill="#6852FF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">V0 / CURRENT HARDWARE PLAN</text><rect x="60" y="260" width="260" height="110" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="78" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">USB supply</text><text x="78" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Board input</text><path d="M320 315L405 315" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="405" y="260" width="310" height="110" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="423" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Board regulation</text><text x="423" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Required logic rails</text><path d="M715 315L800 315" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="800" y="260" width="340" height="110" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="818" y="295" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Electronics</text><text x="818" y="325" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Controller / display / storage</text><text x="60" y="460" fill="#6852FF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">FUTURE / AFTER MEASURING ENERGY DEMAND</text><rect x="60" y="495" width="225" height="130" rx="0" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="7 5"/><text x="78" y="530" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Solar panel</text><text x="78" y="560" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Rating TBD</text><path d="M285 560L345 560" stroke="#65636A" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="345" y="495" width="225" height="130" rx="0" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="7 5"/><text x="363" y="530" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Charge + power path</text><text x="363" y="560" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Controller / protection TBD</text><path d="M570 560L630 560" stroke="#65636A" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="630" y="495" width="225" height="130" rx="0" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="7 5"/><text x="648" y="530" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Storage</text><text x="648" y="560" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Chemistry / capacity TBD</text><path d="M855 560L915 560" stroke="#65636A" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="915" y="495" width="225" height="130" rx="0" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="7 5"/><text x="933" y="530" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Regulated rails</text><text x="933" y="560" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Voltage / peak load TBD</text><text x="60" y="684" fill="#65636A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">No solar autonomy, runtime, charging performance or energy budget has been validated.</text><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">NOT AN ELECTRICAL SCHEMATIC / NO UNVERIFIED CHARGING CIRCUIT SHOULD BE BUILT</text></svg>