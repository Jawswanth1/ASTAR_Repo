<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Educational content flow</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The human review step protects original wording, source placement and assessment integrity.</text><rect x="60" y="240" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="78" y="275" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Source</text><text x="78" y="305" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Rights + page references</text><path d="M370 300L445 300" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="445" y="240" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="463" y="275" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Structure</text><text x="463" y="305" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Chapters / sections</text><path d="M755 300L830 300" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="830" y="240" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="848" y="275" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Review</text><text x="848" y="305" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Text / figures / questions</text><rect x="60" y="470" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="78" y="505" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Map</text><text x="78" y="535" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Lesson and question IDs</text><path d="M370 530L445 530" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="445" y="470" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="463" y="505" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Validate</text><text x="463" y="535" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Warnings + answer keys</text><path d="M755 530L830 530" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="830" y="470" width="310" height="120" rx="0" fill="#FFFFFF" stroke="#0C0C0E" stroke-width="2"/><text x="848" y="505" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Export</text><text x="848" y="535" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Offline package</text><path d="M985 360L985 413" stroke="#0C0C0E" stroke-width="2" fill="none"/><path d="M985 413L215 413" stroke="#0C0C0E" stroke-width="2" fill="none"/><path d="M215 413L215 470" stroke="#0C0C0E" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="60" y="675" fill="#65636A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Forge preserves source pages. Automatic detection is a review aid, not a content-accuracy guarantee.</text><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">FORGE / CONTENT PREPARATION PROTOTYPE</text></svg>