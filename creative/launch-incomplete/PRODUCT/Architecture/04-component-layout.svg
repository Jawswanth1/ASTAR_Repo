<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Component layout / future enclosure</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Placement study only. Module geometry is symbolic and does not represent a bill of materials.</text><rect x="90" y="220" width="650" height="420" rx="20" fill="#FAFAF8" stroke="#0C0C0E" stroke-width="2"/><rect x="120" y="250" width="355" height="180" rx="6" fill="#ECEBE6" stroke="#0C0C0E" stroke-width="2"/><text x="145" y="298" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">E-paper backplane</text><text x="145" y="333" fill="#65636A" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Final display not selected</text><rect x="505" y="250" width="195" height="110" rx="6" fill="#ECEBE6" stroke="#0C0C0E" stroke-width="2"/><text x="523" y="288" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Controller</text><text x="523" y="321" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">ESP32-S3 class</text><rect x="505" y="390" width="195" height="95" rx="6" fill="#ECEBE6" stroke="#0C0C0E" stroke-width="2"/><text x="523" y="431" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">microSD</text><text x="523" y="459" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Accessible edge</text><rect x="120" y="462" width="355" height="140" rx="6" fill="#FFFFFF" stroke="#65636A" stroke-width="2" stroke-dasharray="8 5"/><text x="145" y="505" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Future energy storage</text><text x="145" y="538" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Protected cell / dimensions TBD</text><text x="145" y="572" fill="#65636A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Not installed in V0</text><text x="805" y="280" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Schematic placement</text><text x="805" y="323" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">No custom PCB designed</text><text x="805" y="358" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Clearances not validated</text><text x="805" y="393" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Thermal design not validated</text><text x="805" y="470" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">V0 uses loose modules</text><text x="805" y="506" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">on a breadboard.</text><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">CONCEPT / NOT A MANUFACTURING OR WIRING DRAWING</text></svg>