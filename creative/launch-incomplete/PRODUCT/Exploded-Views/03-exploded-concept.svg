<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ASTAR concept</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0C0C0E"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="48" fill="#6852FF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ASTAR / PRODUCT DEVELOPMENT</text><text x="50" y="110" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Exploded assembly / future concept</text><text x="50" y="148" fill="#65636A" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Layer order and assembly strategy. All internal envelopes require component selection and clearance checks.</text><g transform="translate(160,230) skewX(-22) scale(1,.30)"><rect x="0" y="0" width="540" height="150" rx="14" fill="#222329" stroke="#0C0C0E" stroke-width="2"/></g><path d="M720 255L830 255" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="855" y="262" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">01  Front bezel + controls</text><g transform="translate(160,330) skewX(-22) scale(1,.30)"><rect x="0" y="0" width="540" height="150" rx="14" fill="#E3E2DB" stroke="#0C0C0E" stroke-width="2"/></g><path d="M720 355L830 355" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="855" y="362" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">02  E-paper module / final size TBD</text><g transform="translate(160,430) skewX(-22) scale(1,.30)"><rect x="0" y="0" width="540" height="150" rx="14" fill="#C5C5C8" stroke="#0C0C0E" stroke-width="2"/></g><path d="M720 455L830 455" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="855" y="462" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">03  Electronics carrier / proposed</text><g transform="translate(160,530) skewX(-22) scale(1,.30)"><rect x="0" y="0" width="540" height="150" rx="14" fill="#DFDCD4" stroke="#0C0C0E" stroke-width="2"/></g><path d="M720 555L830 555" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="855" y="562" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">04  Storage space / chemistry TBD</text><g transform="translate(160,630) skewX(-22) scale(1,.30)"><rect x="0" y="0" width="540" height="150" rx="14" fill="#303137" stroke="#0C0C0E" stroke-width="2"/></g><path d="M720 655L830 655" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="855" y="662" fill="#0C0C0E" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">05  Rear enclosure + service cover</text><path d="M425 211L425 706" stroke="#65636A" stroke-width="2" fill="none" stroke-dasharray="5 7"/><path d="M50 742L1150 742" stroke="#C9C6CE" stroke-width="2" fill="none"/><text x="50" y="772" fill="#65636A" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">CONCEPT / NOT A MANUFACTURING OR WIRING DRAWING</text></svg>